x-app-env: &app-env
  DATABASE_URL: postgresql://imagequeue:local_dev_password@postgres:5432/imagequeue
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: imagequeue
      POSTGRES_USER: imagequeue
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imagequeue -d imagequeue"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations/*.sql in filename order, then exits.
  migrate:
    image: postgres:16.6-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://imagequeue:local_dev_password@postgres:5432/imagequeue
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        for f in /migrations/*.sql; do
          echo "applying $$f"
          psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f" || exit 1
        done
    restart: "no"

  web:
    build: .
    image: image-queue:1.0
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Same image, different command. No ports: nothing connects to it.
  worker:
    build: .
    image: image-queue:1.0
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      LEASE_SECONDS: "30"
      SLOW_MS: "0"        # set to "20000" to practise killing the worker mid-job
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
